name: build-hard
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - shell: bash
        run: python eval/build_hard.py 2>&1 | tee eval/build_hard.log
      - name: Commit
        if: always()
        run: |
          git config user.name "eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          for f in eval/questions_hard.jsonl eval/build_hard.log; do [ -f "$f" ] && git add "$f"; done
          git commit -m "eval: build hard tier [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i*5)); done
