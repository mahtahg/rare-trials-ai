name: rescore
# Re-score saved eval runs (no model calls; needs network only for live identifier validation).
on:
  workflow_dispatch:
    inputs:
      runs: { description: "Space-separated run_id:question_file pairs", required: true,
              default: "v1-sonnet:eval/questions.jsonl hard-sonnet:eval/questions_hard.jsonl hard-haiku:eval/questions_hard.jsonl" }
permissions:
  contents: write
concurrency:
  group: eval-rescore
  cancel-in-progress: false
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Score
        shell: bash
        run: |
          set -e
          EXCL=""; [ -f eval/excluded_questions.json ] && EXCL="--exclude eval/excluded_questions.json"
          for pair in ${{ inputs.runs }}; do
            run="${pair%%:*}"; q="${pair#*:}"
            echo "== $run ($q)"
            python eval/score.py --questions "$q" --run "eval/results/$run" --validate-ids $EXCL
          done
          python eval/compare.py
      - name: Commit
        if: always()
        run: |
          git config user.name "eval-bot"
          git config user.email "eval-bot@users.noreply.github.com"
          git add eval/results
          git commit -m "eval: rescore [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i*5)); done
