name: build-questions
on:
  workflow_dispatch:
    inputs:
      per_template: { default: "20" }
      seed: { default: "20261103" }
      only: { description: "space-separated templates to rebuild (blank = all)", default: "" }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - shell: bash
        run: python eval/build_questions.py --per-template ${{ inputs.per_template }} --seed ${{ inputs.seed }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }} 2>&1 | tee eval/build.log
      - name: Commit
        if: always()
        run: |
          git config user.name "eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          for f in eval/questions.jsonl eval/questions.manifest.json eval/build.log; do [ -f "$f" ] && git add "$f"; done
          git commit -m "eval: build question bank [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i*5)); done
