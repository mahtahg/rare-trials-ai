name: bgo-diag
# Diagnose BioMCP 'Connection closed' failures by replaying recorded tool calls (no model calls).
on:
  workflow_dispatch:
    inputs:
      bgo_version: { default: "0.9.3" }
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "biomcp-cli==${{ inputs.bgo_version }}" "mcp>=1.20" && biomcp version
      - name: Replay, 2 concurrent, shared cache (as in the evaluation)
        run: python tools/bgo_replay.py --concurrency 2 --cache shared || true
      - name: Replay, 2 concurrent, separate caches
        run: python tools/bgo_replay.py --concurrency 2 --cache separate || true
      - name: Replay, 1 at a time, shared cache
        run: python tools/bgo_replay.py --concurrency 1 --cache shared || true
      - name: Commit
        if: always()
        run: |
          git config user.name "eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          git add eval/review/bgo_diag; git commit -m "bgo diag [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i*5)); done
