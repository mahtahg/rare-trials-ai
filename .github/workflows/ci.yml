name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["probe/out/**", "eval/results/**", "project6/data/**", "**.md"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly live contract check against upstream APIs
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -m "not live" -q
  live:
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Live contract tests (records cassettes)
        env: { BIOMCP_CASSETTE_MODE: record }
        shell: bash
        run: pytest -m live -q -rA 2>&1 | tee live-tests.txt
      - name: Commit cassettes + report
        if: always()
        run: |
          mkdir -p reports && mv live-tests.txt reports/ || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add tests/cassettes reports
          git commit -m "ci: refresh cassettes [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i*5)); done
