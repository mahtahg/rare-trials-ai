name: p6-extract
# LLM-assisted extraction on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN). Resumable.
on:
  workflow_dispatch:
    inputs:
      model: { default: "claude-sonnet-5-5" }
      batch: { default: "8" }
      max_minutes: { default: "300" }
permissions:
  contents: write
concurrency: { group: p6-extract, cancel-in-progress: false }
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code && claude --version
      - shell: bash
        run: python project6/pipeline/llm_extract.py --model "${{ inputs.model }}" --batch ${{ inputs.batch }} --max-minutes ${{ inputs.max_minutes }}
      - name: Commit
        if: always()
        run: |
          git config user.name "p6-bot"; git config user.email "p6-bot@users.noreply.github.com"
          git add project6/data/llm_extract_v1.jsonl project6/data/llm_extract_v1.REMAINING || true
          git commit -m "p6: LLM extraction progress [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i*5)); done
