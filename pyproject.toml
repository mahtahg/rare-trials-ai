[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "raremcp"
version = "0.1.1"
description = "MCP servers for public biomedical data used in rare and neglected disease drug development and trials"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mahta Haghighat Ghahfarokhi" }]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
eval = ["pandas>=2.0"]

[project.scripts]
raremcp-ctgov = "raremcp.servers.ctgov:main"
raremcp-opentargets = "raremcp.servers.opentargets:main"
raremcp-chembl = "raremcp.servers.chembl:main"
raremcp-fda = "raremcp.servers.fda:main"
raremcp-europepmc = "raremcp.servers.europepmc:main"
raremcp-orphanet = "raremcp.servers.orphanet:main"
raremcp-all = "raremcp.servers.all:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raremcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real APIs (run in CI with network)"]

[tool.ruff]
line-length = 120
target-version = "py310"
