[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biomcp-rare"
version = "0.1.0"
description = "MCP servers for public biomedical data used in rare and neglected disease drug development and trials"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mahta Haghighat Ghahfarokhi" }]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
eval = ["anthropic>=0.40", "pandas>=2.0", "scipy>=1.11"]

[project.scripts]
biomcp-ctgov = "biomcp.servers.ctgov:main"
biomcp-opentargets = "biomcp.servers.opentargets:main"
biomcp-chembl = "biomcp.servers.chembl:main"
biomcp-fda = "biomcp.servers.fda:main"
biomcp-europepmc = "biomcp.servers.europepmc:main"
biomcp-orphanet = "biomcp.servers.orphanet:main"
biomcp-all = "biomcp.servers.all:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real APIs (run in CI with network)"]

[tool.ruff]
line-length = 120
target-version = "py310"
